# Copie ce fichier en config.yaml : dans le dossier d'où tu lances jarvis, ou dans le
# dossier de données (macOS : ~/Library/Application Support/jarvis,
# Windows : %LOCALAPPDATA%\jarvis). Tout est optionnel ; « auto » choisit selon ta
# machine (voir `jarvis doctor`).

user_name: ""               # ton prénom, pour que Jarvis s'adresse à toi

wakeword:
  model: hey_jarvis
  threshold: 0.5            # monte à 0.6-0.7 s'il se réveille tout seul

vad:
  end_silence_ms: 550       # silence qui clôt ta phrase : plus bas = plus réactif, mais te coupe si tu hésites
  preroll_ms: 250
  start_timeout_s: 5
  max_utterance_s: 15

stt:
  backend: auto             # mlx (Apple Silicon) | faster-whisper (Windows/Linux, CUDA ou CPU)
  model: auto               # ex. mlx-community/whisper-large-v3-turbo-q4, large-v3-turbo, small
  device: auto              # metal | cuda | cpu
  compute_type: auto
  language: fr

llm:
  backend: ollama           # moteur au démarrage : ollama (local) | claude. À la voix : « passe sur Claude » / « passe en local »
  model: auto               # ex. qwen3.5:4b-mlx (Mac 16 Go), qwen3.5:4b (GPU 6-8 Go), qwen3.5:2b
  host: http://127.0.0.1:11434
  num_ctx: 4096
  max_tokens: 320
  temperature: 0.6
  keep_alive: 30m           # le modèle reste chargé entre deux questions
  history_turns: 6

claude:                     # moteur Claude : le binaire officiel `claude`, connecté avec `claude auth login`
  model: haiku              # haiku = réponse la plus rapide ; sonnet pour les questions difficiles
  auth: subscription        # subscription (ton abonnement) | api_key (variable ANTHROPIC_API_KEY)
  executable: claude
  effort: ""                # vide = défaut du modèle ; low = moins de réflexion, plus rapide
  fallback_to_local: true   # si Claude échoue avant de parler, Jarvis répond en local
  first_token_timeout_s: 30

tts:
  backend: auto             # auto : voix naturelle Pocket TTS, Piper si la machine est trop lente | pocket | piper
  voice: fantine            # Pocket TTS : fantine (la plus fiable), cosette ; marius, jean (masculines, instables sur les phrases courtes) ; ou un .wav
  temperature: 0.5          # Pocket TTS : plus bas = plus stable, plus haut = plus expressif
  piper_voice: fr_FR-siwis-medium  # voix de secours : fr_FR-siwis-medium, fr_FR-tom-medium
  length_scale: 1.0         # Piper : 0.9 = parle 10 % plus vite

tools:                      # actions sur le PC
  enabled: true
  always_allow: []          # actions N2 autorisées sans confirmation (rempli quand tu réponds « toujours »)
  disabled: []              # actions interdites, ex. [power, close_app]
  confirm_timeout_s: 6      # temps pour répondre « oui » / « non »

screen:                     # analyse de l'écran par le modèle de vision local (rien ne quitte la machine)
  enabled: true
  interval_s: 20            # au plus une analyse toutes les 20 s, seulement si l'écran a changé
  max_width: 1024           # largeur de la capture : plus petit = plus rapide
  model: ""                 # vide = le modèle Ollama principal (qwen3.5 gère les images)

browser:                    # pilotage du navigateur (volume des vidéos, clic, onglets…)
  enabled: true
  port: 47831               # port local du pont avec l'extension (`jarvis extension` pour l'installer)

review:                     # « fais une review de mon code » : projet, changements ou fichier ouvert dans l'éditeur
  claude_model: sonnet      # avec Claude (lecture seule du projet) ; le moteur actif est utilisé par défaut
  max_chars: 120000         # modèle local : volume de code relu au plus
  timeout_s: 900

ui:
  window: app               # app (fenêtre Jarvis) | browser | none
  port: 0                   # 0 = port libre choisi au démarrage

audio:
  input_device: null        # index ou nom, voir `jarvis devices`
  output_device: null
  follow_up_s: 4            # après une réponse, écoute une relance sans « Hey Jarvis » (0 = désactivé)
